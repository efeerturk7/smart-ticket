version: '3.8'

networks:
  smart-ticket-net:
    driver: bridge

services:

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
      POSTGRES_DB: smart_ticket_db
    networks:
      - smart-ticket-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M


  redis:
    image: redis:alpine
    networks:
      - smart-ticket-net
    deploy:
      resources:
        limits:
          memory: 256M


  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - smart-ticket-net
    deploy:
      resources:
        limits:
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - smart-ticket-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G


  ticket-service:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - kafka
    environment:

      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smart_ticket_db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - smart-ticket-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M